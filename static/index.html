<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrabbyTube</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>GrabbyTube</h1>
    <p class="subtitle">Search &rarr; Queue &rarr; MP3</p>
    <div class="stats">
      <span id="track-count">0 tracks</span>
      <span id="queue-count">0 queued</span>
    </div>
  </header>

  <!-- Search -->
  <section id="search-section">
    <h2>Search</h2>
    <form id="search-form">
      <input type="text" id="search-input" placeholder="Enter song name..." autocomplete="off" required>
      <button type="submit" id="search-btn">Search</button>
    </form>
    <div id="search-results" class="results-list"></div>
  </section>

  <!-- Batch Queue -->
  <section id="batch-section">
    <h2>Batch Queue</h2>
    <textarea id="batch-input" placeholder="Paste YouTube URLs (one per line or space-separated)..."></textarea>
    <button type="button" id="batch-btn">Enqueue All</button>
    <div id="batch-status"></div>
  </section>

  <!-- Queue -->
  <section id="queue-section">
    <h2>Queue <span id="queue-badge"></span></h2>
    <div class="queue-actions">
      <button class="btn btn-secondary btn-clear-jobs" id="clear-jobs-btn">Clear Done/Failed</button>
      <button class="btn btn-secondary btn-clear-completed" id="clear-completed-btn">Clear Successful</button>
    </div>
    <div id="job-list" class="results-list"></div>
  </section>

  <!-- Tracks -->
  <section id="tracks-section">
    <h2>
      Library
      <select id="sort-select">
        <option value="createdAt">Date Added</option>
        <option value="title">Title</option>
        <option value="author">Author</option>
        <option value="publishedAt">Published</option>
        <option value="duration">Duration</option>
      </select>
    </h2>
    <div class="library-actions">
      <button class="btn btn-secondary" id="find-duplicates-btn">Find Duplicates</button>
    </div>
    <div id="cleaned-titles-section" class="cleaned-titles-box">
      <div class="cleaned-titles-header">
        <span>Cleaned Titles (for manual LLM testing)</span>
        <button class="btn btn-secondary" id="copy-cleaned-btn" style="font-size:0.7rem;padding:3px 10px;">Copy</button>
      </div>
      <textarea id="cleaned-titles-text" readonly rows="6"></textarea>
    </div>
    <div id="track-list" class="results-list"></div>
  </section>
</div>

<!-- Audio player -->
<div id="player-bar">
  <span id="player-title"></span>
  <audio id="player" controls></audio>
</div>

<!-- Duplicates modal -->
<div id="duplicates-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Potential Duplicates</h3>
      <button class="btn btn-secondary" id="close-duplicates-btn">&times;</button>
    </div>
    <div id="duplicates-list" class="results-list"></div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="delete-selected-btn" disabled>Delete Selected</button>
      <span id="duplicates-summary"></span>
    </div>
  </div>
</div>

<script src="/static/js/app.js?v=10"></script>
</body>
</html>
