services:
  grabbytube:
    build: .
    container_name: grabbytube
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
      - "8101:8101"
    volumes:
      # Host sides are repo-relative (no machine identity); the shared cache is
      # the sibling DrivePod cache dir, reached as /cache inside the container
      # (GRABBY_OUTPUT_DIR in .env).
      - ../DrivePod/cache:/cache
      - ./grabby-tracks.json:/app/grabby-tracks.json
      - ./grabbytube.db:/app/grabbytube.db
      - /lib/modules:/lib/modules:ro
      - ./static:/app/static
      - .:/app
      - ./data:/app/data
      - ../ytcookies/data:/shared-cookies
    env_file:
      - .env
    depends_on:
      - bgutil-provider
    networks:
      - shared

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: grabbytube-bgutil
    init: true
    restart: unless-stopped
    networks:
      - shared

networks:
  shared:
    external: true
