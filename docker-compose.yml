services:
  grabbytube:
    build: .
    container_name: grabbytube
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
      - "8101:8101"
    volumes:
      - /home/user/projects/drivepod/cache:/home/user/projects/drivepod/cache
      - ./grabby-tracks.json:/app/grabby-tracks.json
      - ./grabbytube.db:/app/grabbytube.db
      - /lib/modules:/lib/modules:ro
      - ./static:/app/static
    env_file:
      - .env
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: grabbytube-bgutil
    init: true
    restart: unless-stopped
