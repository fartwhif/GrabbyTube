services:
  grabbytube:
    build: .
    container_name: grabbytube
    ports:
      - "8101:8101"
    volumes:
      - ./output:/app/output
      - ./tracks.json:/app/tracks.json
      - ./grabbytube.db:/app/grabbytube.db
    restart: unless-stopped
    dns:
      - 10.255.255.254
      - 8.8.8.8
    environment:
      - GRABBY_HOST=0.0.0.0
      - GRABBY_PORT=8101
      - GRABBY_OUTPUT_DIR=/app/output
      - GRABBY_MAX_CONCURRENT=2
      - GRABBY_PREFERRED_BITRATE=320k
